<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 لعبة التحويل — تدريب مفتوح مع خطوات الحل</title>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 20px;
      direction: rtl;
    }
    h1 { color: #38bdf8; margin-bottom: 6px; }
    .game {
      max-width: 640px;
      margin: 10px auto 40px;
      background: #1e293b;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 0 18px rgba(0,0,0,0.6);
      text-align: center;
    }
    .modes {
      display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px;
    }
    .modes button {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      cursor:pointer;
      font-weight:600;
    }
    .modes button.active { background:#38bdf8; color:#0f172a; }
    .question {
      margin: 12px 0;
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: bold;
    }
    input[type="text"] {
      width: 86%;
      max-width: 420px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 8px;
      direction: ltr;
    }
    .controls { display:flex; justify-content:center; gap:10px; margin-bottom:8px; }
    .controls button { border:none; border-radius:8px; padding:8px 12px; font-weight:700; cursor:pointer; }
    .check { background:#38bdf8; color:#0f172a; }
    .next { background:#334155; color:#e2e8f0; }
    .feedback { margin-top:8px; font-weight:800; min-height:26px; }
    .correct { color:#86efac; }
    .wrong { color:#fb7185; }
    .solution {
      text-align:right;
      background:#06132a;
      border:1px solid #213042;
      border-radius:8px;
      padding:12px;
      margin-top:10px;
      font-size:0.95rem;
      line-height:1.6;
      white-space:pre-wrap;
    }
    .hint { color:#94a3b8; font-size:0.95rem; margin-top:8px; }
    @media (max-width:520px){
      input[type="text"]{width:92%;}
      .game{padding:16px;}
    }
  </style>
</head>
<body>

<h1>🎯 لعبة التحويل — تدريب مفتوح</h1>
<p class="hint">اختر نوع التحويل، اكتب الإجابة ثم اضغط "تحقق". تحت كل إجابة ستظهر خطوات الحل بالتفصيل.</p>

<div class="game" role="application" aria-live="polite">
  <div class="modes" role="tablist">
    <button class="active" data-mode="bin2dec">ثنائي → عشري</button>
    <button data-mode="dec2bin">عشري → ثنائي</button>
    <button data-mode="bin2oct">ثنائي → ثماني</button>
    <button data-mode="oct2bin">ثماني → ثنائي</button>
    <button data-mode="dec2hex">عشري → ست عشري</button>
    <button data-mode="hex2dec">ست عشري → عشري</button>
  </div>

  <div class="question" id="question" aria-live="polite"></div>

  <input id="answer" type="text" placeholder="✏️ اكتب الإجابة هنا (حرف كبير للـ A-F عند الحاجة)" autocomplete="off">

  <div class="controls">
    <button class="check" id="checkBtn">تحقق</button>
    <button class="next" id="nextBtn">التالي</button>
  </div>

  <div class="feedback" id="feedback" aria-live="polite"></div>

  <div id="solution" class="solution" style="display:none;"></div>
</div>

<script>
(() => {
  const modeButtons = document.querySelectorAll('.modes button');
  const qEl = document.getElementById('question');
  const ansEl = document.getElementById('answer');
  const fb = document.getElementById('feedback');
  const solEl = document.getElementById('solution');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');

  let mode = 'bin2dec';
  let current = {};

  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function padLeft(str, len, ch='0'){ return (ch.repeat(len) + str).slice(-len); }

  // توليد سؤال وقيمة صحيحة وخطوات حل مفصّلة
  function generate(){
    fb.textContent = '';
    fb.className = 'feedback';
    solEl.style.display = 'none';
    solEl.textContent = '';
    ansEl.value = '';
    const n = rand(1,255); // مرن للعرض — يمكن تغييره
    let q='', correct='', steps='';

    if(mode === 'bin2dec'){
      q = n.toString(2); // عرض الثنائي بدون بادئات
      correct = parseInt(q,2).toString(10);
      // خطوات: عرض كل بت ووزنه ثم الجمع
      const bits = q.split('').reverse();
      const details = bits.map((b,i)=> `البت ${b} × (2^${i}) = ${b==='1' ? (Math.pow(2,i)) : 0}`).join('\n');
      const ones = bits.reduce((acc,b,i) => acc + (b==='1' ? Math.pow(2,i) : 0), 0);
      steps = `المطلوب: تحويل ${q} (نظام ثنائي) إلى نظام عشري.\n\nخطوات الحل:\n1) نكتب قيمة كل بت من اليمين لليسار كقوة للرقم 2 (2^0, 2^1, 2^2, ...).\n2) نضرب كل بت في قيمة (2^الموضع) ونذكر الناتج:\n${details}\n\n3) الآن نجمع القيم الناتجة: ${ones}\n4) النتيجة (عشري) = ${correct}.`;
    }
    else if(mode === 'dec2bin'){
      q = n.toString(10);
      correct = n.toString(2);
      // خطوات: القسمة على 2 مع بواقي
      let temp = n;
      const remainders = [];
      const stepsArr = [];
      while(temp > 0){
        const r = temp % 2;
        remainders.push(r);
        stepsArr.push(`${temp} ÷ 2 = ${Math.floor(temp/2)} ، الباقي = ${r}`);
        temp = Math.floor(temp/2);
      }
      steps = `المطلوب: تحويل ${q} (عشري) إلى ثنائي.\n\nخطوات الحل (قسمة متكررة على 2):\n${stepsArr.join('\n')}\n\nنقرأ البواقي من الأسفل إلى الأعلى: ${remainders.reverse().join('')} \n\nالنتيجة (ثنائي) = ${correct}.`;
    }
    else if(mode === 'bin2oct'){
      q = n.toString(2);
      // مجموعة من 3 بت من اليمين
      const padded = padLeft(q, Math.ceil(q.length/3)*3, '0');
      const groups = padded.match(/.{1,3}/g).map(g => g);
      const octDigits = groups.map(g => parseInt(g,2).toString(8));
      correct = octDigits.join('').replace(/^0+/,'') || '0';
      steps = `المطلوب: تحويل ${q} (ثنائي) إلى نظام ثماني.\n\nخطوات الحل:\n1) نضيف أصفاراً على اليسار حتى يصبح طول الثنائي مضاعفاً لِـ3: ${padded}\n2) نقسم إلى مجموعات من 3 بت (من اليسار): ${groups.join(' , ')}\n3) كل مجموعة 3 بت نحولها إلى رقم ثماني:\n${groups.map((g,i)=>`${g} (ثنائي) → ${parseInt(g,2)} (عشري) → ${octDigits[i]} (ثماني)`).join('\n')}\n\n4) نقرأ الأرقام الثمانية معاً: ${correct}\n\nالنتيجة (ثماني) = ${correct}.`;
    }
    else if(mode === 'oct2bin'){
      // نولد رقم ثماني (0..377) باستخدام n كقيمة داخل النطاق
      // نأخذ رقم عشري n ثم نحوله إلى ثماني لعرض
      const oct = parseInt((n % 512)).toString(8); // قيمة ثنائية
      q = oct;
      correct = parseInt(q,8).toString(2);
      // خطوات: كل خانة ثمانية -> 3 بت
      const groups = q.split('');
      const conv = groups.map(d => padLeft(parseInt(d,8).toString(2),3));
      steps = `المطلوب: تحويل ${q} (ثماني) إلى ثنائي.\n\nخطوات الحل:\n1) نأخذ كل رقم ثماني ونحوّله إلى 3 بت ثنائي (بوضع أصفار من اليسار إن لزم):\n${groups.map((d,i)=>`${d} (ثماني) → ${conv[i]} (ثنائي)`).join('\n')}\n\n2) ندمج كل المجموعات معاً من اليسار إلى اليمين: ${conv.join('')}\n\nالنتيجة (ثنائي) = ${correct}.`;
    }
    else if(mode === 'dec2hex'){
      q = n.toString(10);
      correct = n.toString(16).toUpperCase();
      // خطوات: قسمة على 16 مع بواقي
      let temp = n;
      const stepsArr = [];
      const remainders = [];
      while(temp > 0){
        const r = temp % 16;
        remainders.push(r);
        const hexR = r >= 10 ? String.fromCharCode(55 + r) : String(r); // 10->A
        stepsArr.push(`${temp} ÷ 16 = ${Math.floor(temp/16)} ، الباقي = ${r} → ${hexR}`);
        temp = Math.floor(temp/16);
      }
      steps = `المطلوب: تحويل ${q} (عشري) إلى ست عشري.\n\nخطوات الحل (قسمة على 16):\n${stepsArr.join('\n')}\n\nنقرأ البواقي من الأسفل إلى الأعلى ونحوّل القيم ≥10 إلى أحرف (10→A, 11→B ...): ${remainders.reverse().map(r=> r>=10 ? String.fromCharCode(55 + r) : String(r)).join('')}\n\nالنتيجة (ست عشري) = ${correct}.`;
    }
    else if(mode === 'hex2dec'){
      // نأخذ قيمة ست عشري من n (سيكون مكوّن من 1-3 خانات hex)
      const hex = n.toString(16).toUpperCase();
      q = hex;
      const digits = hex.split('').reverse();
      const parts = digits.map((d,i) => {
        const val = parseInt(d,16);
        return `${d} × (16^${i}) = ${val} × ${Math.pow(16,i)} = ${val * Math.pow(16,i)}`;
      });
      const total = digits.reduce((acc,d,i)=> acc + parseInt(d,16)*Math.pow(16,i),0);
      correct = total.toString(10);
      steps = `المطلوب: تحويل ${q} (ست عشري) إلى عشري.\n\nخطوات الحل:\n1) نكتب كل رقم ست عشري ونحدّد قيمته العشرية (A=10..F=15) ثم نضربه في 16 مرفوعة لأس موقعه (من اليمين 0,1,2...):\n${parts.join('\n')}\n\n2) نجمع النتائج: ${total}\n\nالنتيجة (عشري) = ${correct}.`;
    }

    current = { q: String(q).toUpperCase(), correct: String(correct).toUpperCase(), steps };
    qEl.innerHTML = `حوّل: <strong dir="ltr">${current.q}</strong>`;
    ansEl.focus();
  }

  // فتح وضع المود المختار
  modeButtons.forEach(b=>{
    b.addEventListener('click', () => {
      modeButtons.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      mode = b.dataset.mode;
      generate();
    });
  });

  // تطبيع ثنائي: نحذف مسافات وأصفار بادئة عند المقارنة إذا كان مبرر
  function normalizeInput(inp){
    return inp.trim().replace(/\s+/g,'').toUpperCase();
  }

  function checkAnswer(){
    const user = normalizeInput(ansEl.value);
    if(!user){
      fb.textContent = '✏️ اكتب الإجابة أولاً';
      fb.className = 'feedback wrong';
      return;
    }
    const correct = current.correct.toUpperCase();
    // للمقارنة: في بعض الحالات نسمح بصيغ متعددة (مثلاً ثنائي مع/بدون أصفار بادئة)
    let ok = false;
    if(mode === 'dec2bin' || mode === 'hex2dec' || mode === 'dec2hex' || mode === 'bin2oct' || mode === 'oct2bin' || mode === 'bin2dec'){
      // قارن نصي مباشر بعد تطبيع
      // للسلاسل الثنائية/ثمانية/ست عشري، نقارن بعد إزالة أصفار بادئة إذا كان المستخدم أدخلها
      const normUser = user.replace(/^0+/, '') || '0';
      const normCorrect = correct.replace(/^0+/, '') || '0';
      ok = (normUser === normCorrect);
    } else {
      ok = (user === correct);
    }

    if(ok){
      fb.textContent = '✅ إجابة صحيحة — ممتاز!';
      fb.className = 'feedback correct';
    } else {
      fb.textContent = `❌ إجابة خاطئة — الصحيح: ${correct}`;
      fb.className = 'feedback wrong';
    }

    // عرض خطوات الحل التفصيلية
    solEl.style.display = 'block';
    solEl.textContent = '💡 خطوات الحل التفصيلية:\n\n' + current.steps;
  }

  checkBtn.addEventListener('click', checkAnswer);
  nextBtn.addEventListener('click', generate);
  ansEl.addEventListener('keydown', e => { if(e.key === 'Enter') checkAnswer(); });

  // توليد أول سؤال
  generate();
})();
</script>

</body>
</html>
