<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 لعبة التحويل — تدريب مفتوح مع خطوات الحل</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 20px;
      direction: rtl;
      margin: 0;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .hint {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    /* زر العودة */
    .back-container {
      max-width: 640px;
      margin: 0 auto 15px;
      text-align: right;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 9px 15px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-shadow: 0 0 0 rgba(56, 189, 248, 0);
    }

    .back-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      transform: translateX(3px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .game {
      max-width: 640px;
      margin: 10px auto 40px;
      background: #1e293b;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .modes button {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .modes button:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .modes button.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .question {
      margin: 12px 0;
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: bold;
    }

    input[type="text"] {
      width: 86%;
      max-width: 420px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 8px;
      direction: ltr;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .controls button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .check {
      background: #38bdf8;
      color: #0f172a;
    }

    .check:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .next {
      background: #334155;
      color: #e2e8f0;
    }

    .next:hover {
      background: #475569;
      transform: translateY(-1px);
    }

    .feedback {
      margin-top: 8px;
      font-weight: 800;
      min-height: 26px;
    }

    .correct {
      color: #86efac;
    }

    .wrong {
      color: #fb7185;
    }

    .solution {
      text-align: right;
      background: #06132a;
      border: 1px solid #213042;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      input[type="text"] {
        width: 92%;
      }

      .game {
        padding: 16px;
      }

      .back-container {
        text-align: center;
      }

      .back-btn {
        width: 100%;
        justify-content: center;
      }

      .modes button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>

  <!-- زر العودة للصفحة الرئيسية -->
  <div class="back-container">
    <a href="index_1.html" class="back-btn">
      🏠 العودة للصفحة الرئيسية
    </a>
  </div>

  <h1>🎯 لعبة التحويل — تدريب مفتوح</h1>

  <p class="hint">
    اختر نوع التحويل، اكتب الإجابة ثم اضغط "تحقق".
    تحت كل إجابة ستظهر خطوات الحل بالتفصيل.
  </p>

  <div class="game" role="application" aria-live="polite">

    <div class="modes" role="tablist">

      <button class="active" data-mode="bin2dec">
        ثنائي → عشري
      </button>

      <button data-mode="dec2bin">
        عشري → ثنائي
      </button>

      <button data-mode="bin2oct">
        ثنائي → ثماني
      </button>

      <button data-mode="oct2bin">
        ثماني → ثنائي
      </button>

      <button data-mode="dec2hex">
        عشري → ست عشري
      </button>

      <button data-mode="hex2dec">
        ست عشري → عشري
      </button>

    </div>

    <div class="question" id="question" aria-live="polite"></div>

    <input
      id="answer"
      type="text"
      placeholder="✏️ اكتب الإجابة هنا (حرف كبير للـ A-F عند الحاجة)"
      autocomplete="off"
    >

    <div class="controls">
      <button class="check" id="checkBtn">
        تحقق
      </button>

      <button class="next" id="nextBtn">
        التالي
      </button>
    </div>

    <div
      class="feedback"
      id="feedback"
      aria-live="polite">
    </div>

    <div
      id="solution"
      class="solution"
      style="display:none;">
    </div>

  </div>

  <script>
    (() => {

      const modeButtons = document.querySelectorAll('.modes button');
      const qEl = document.getElementById('question');
      const ansEl = document.getElementById('answer');
      const fb = document.getElementById('feedback');
      const solEl = document.getElementById('solution');
      const checkBtn = document.getElementById('checkBtn');
      const nextBtn = document.getElementById('nextBtn');

      let mode = 'bin2dec';
      let current = {};

      function rand(min, max) {
        return Math.floor(
          Math.random() * (max - min + 1)
        ) + min;
      }

      function padLeft(str, len, ch = '0') {
        return (ch.repeat(len) + str).slice(-len);
      }

      // توليد سؤال
      function generate() {

        fb.textContent = '';
        fb.className = 'feedback';

        solEl.style.display = 'none';
        solEl.textContent = '';

        ansEl.value = '';

        const n = rand(1, 255);

        let q = '';
        let correct = '';
        let steps = '';

        /* =========================
           ثنائي → عشري
        ========================= */

        if (mode === 'bin2dec') {

          q = n.toString(2);

          correct = parseInt(q, 2).toString(10);

          const bits = q.split('').reverse();

          const details = bits
            .map((b, i) =>
              `البت ${b} × (2^${i}) = ${
                b === '1'
                  ? Math.pow(2, i)
                  : 0
              }`
            )
            .join('\n');

          const ones = bits.reduce(
            (acc, b, i) =>
              acc +
              (b === '1'
                ? Math.pow(2, i)
                : 0),
            0
          );

          steps =
`المطلوب: تحويل ${q} (نظام ثنائي) إلى نظام عشري.

خطوات الحل:

1) نكتب قيمة كل بت من اليمين لليسار كقوة للرقم 2 (2^0, 2^1, 2^2, ...).

2) نضرب كل بت في قيمة (2^الموضع):

${details}

3) الآن نجمع القيم الناتجة:

${ones}

4) النتيجة (عشري) = ${correct}.`;
        }

        /* =========================
           عشري → ثنائي
        ========================= */

        else if (mode === 'dec2bin') {

          q = n.toString(10);

          correct = n.toString(2);

          let temp = n;
          const remainders = [];
          const stepsArr = [];

          while (temp > 0) {

            const r = temp % 2;

            remainders.push(r);

            stepsArr.push(
              `${temp} ÷ 2 = ${Math.floor(temp / 2)} ، الباقي = ${r}`
            );

            temp = Math.floor(temp / 2);
          }

          steps =
`المطلوب: تحويل ${q} (عشري) إلى ثنائي.

خطوات الحل (قسمة متكررة على 2):

${stepsArr.join('\n')}

نقرأ البواقي من الأسفل إلى الأعلى:

${remainders.reverse().join('')}

النتيجة (ثنائي) = ${correct}.`;
        }

        /* =========================
           ثنائي → ثماني
        ========================= */

        else if (mode === 'bin2oct') {

          q = n.toString(2);

          const padded = padLeft(
            q,
            Math.ceil(q.length / 3) * 3,
            '0'
          );

          const groups = padded
            .match(/.{1,3}/g)
            .map(g => g);

          const octDigits = groups.map(
            g => parseInt(g, 2).toString(8)
          );

          correct =
            octDigits
              .join('')
              .replace(/^0+/, '') || '0';

          steps =
`المطلوب: تحويل ${q} (ثنائي) إلى نظام ثماني.

خطوات الحل:

1) نضيف أصفاراً على اليسار حتى يصبح طول الثنائي مضاعفاً لـ 3:

${padded}

2) نقسم إلى مجموعات من 3 بت:

${groups.join(' , ')}

3) نحول كل مجموعة إلى رقم ثماني:

${groups
  .map(
    (g, i) =>
      `${g} (ثنائي) → ${parseInt(g, 2)} (عشري) → ${octDigits[i]} (ثماني)`
  )
  .join('\n')}

4) نقرأ الأرقام الثمانية معاً:

${correct}

النتيجة (ثماني) = ${correct}.`;
        }

        /* =========================
           ثماني → ثنائي
        ========================= */

        else if (mode === 'oct2bin') {

          const oct =
            parseInt(n % 512).toString(8);

          q = oct;

          correct =
            parseInt(q, 8).toString(2);

          const groups = q.split('');

          const conv = groups.map(
            d =>
              padLeft(
                parseInt(d, 8).toString(2),
                3
              )
          );

          steps =
`المطلوب: تحويل ${q} (ثماني) إلى ثنائي.

خطوات الحل:

1) نأخذ كل رقم ثماني ونحوّله إلى 3 بت ثنائي:

${groups
  .map(
    (d, i) =>
      `${d} (ثماني) → ${conv[i]} (ثنائي)`
  )
  .join('\n')}

2) ندمج كل المجموعات معاً:

${conv.join('')}

النتيجة (ثنائي) = ${correct}.`;
        }

        /* =========================
           عشري → ست عشري
        ========================= */

        else if (mode === 'dec2hex') {

          q = n.toString(10);

          correct =
            n.toString(16).toUpperCase();

          let temp = n;

          const stepsArr = [];
          const remainders = [];

          while (temp > 0) {

            const r = temp % 16;

            remainders.push(r);

            const hexR =
              r >= 10
                ? String.fromCharCode(55 + r)
                : String(r);

            stepsArr.push(
              `${temp} ÷ 16 = ${Math.floor(temp / 16)} ، الباقي = ${r} → ${hexR}`
            );

            temp = Math.floor(temp / 16);
          }

          steps =
`المطلوب: تحويل ${q} (عشري) إلى ست عشري.

خطوات الحل (قسمة متكررة على 16):

${stepsArr.join('\n')}

نقرأ البواقي من الأسفل إلى الأعلى.

القيم من 10 إلى 15 تتحول إلى:
10 → A
11 → B
12 → C
13 → D
14 → E
15 → F

الناتج:

${remainders
  .reverse()
  .map(r =>
    r >= 10
      ? String.fromCharCode(55 + r)
      : String(r)
  )
  .join('')}

النتيجة (ست عشري) = ${correct}.`;
        }

        /* =========================
           ست عشري → عشري
        ========================= */

        else if (mode === 'hex2dec') {

          const hex =
            n.toString(16).toUpperCase();

          q = hex;

          const digits =
            hex.split('').reverse();

          const parts = digits.map(
            (d, i) => {

              const val =
                parseInt(d, 16);

              return `${d} × (16^${i}) = ${val} × ${Math.pow(16, i)} = ${val * Math.pow(16, i)}`;
            }
          );

          const total =
            digits.reduce(
              (acc, d, i) =>
                acc +
                parseInt(d, 16) *
                Math.pow(16, i),
              0
            );

          correct =
            total.toString(10);

          steps =
`المطلوب: تحويل ${q} (ست عشري) إلى عشري.

خطوات الحل:

1) نحدد قيمة كل رقم ست عشري:

A = 10
B = 11
C = 12
D = 13
E = 14
F = 15

2) نضرب كل رقم في 16 مرفوعة لأس موقعه، بدءاً من اليمين:

${parts.join('\n')}

3) نجمع النتائج:

${total}

النتيجة (عشري) = ${correct}.`;
        }

        current = {
          q: String(q).toUpperCase(),
          correct: String(correct).toUpperCase(),
          steps
        };

        qEl.innerHTML =
          `حوّل: <strong dir="ltr">${current.q}</strong>`;

        ansEl.focus();
      }

      /* =========================
         تغيير نوع التحويل
      ========================= */

      modeButtons.forEach(button => {

        button.addEventListener('click', () => {

          modeButtons.forEach(
            x => x.classList.remove('active')
          );

          button.classList.add('active');

          mode = button.dataset.mode;

          generate();
        });

      });

      /* =========================
         تنظيف الإجابة
      ========================= */

      function normalizeInput(input) {

        return input
          .trim()
          .replace(/\s+/g, '')
          .toUpperCase();
      }

      /* =========================
         التحقق من الإجابة
      ========================= */

      function checkAnswer() {

        const user =
          normalizeInput(ansEl.value);

        if (!user) {

          fb.textContent =
            '✏️ اكتب الإجابة أولاً';

          fb.className =
            'feedback wrong';

          return;
        }

        const correct =
          current.correct.toUpperCase();

        let ok = false;

        const normUser =
          user.replace(/^0+/, '') || '0';

        const normCorrect =
          correct.replace(/^0+/, '') || '0';

        ok =
          normUser === normCorrect;

        if (ok) {

          fb.textContent =
            '✅ إجابة صحيحة — ممتاز!';

          fb.className =
            'feedback correct';

        } else {

          fb.textContent =
            `❌ إجابة خاطئة — الصحيح: ${correct}`;

          fb.className =
            'feedback wrong';
        }

        solEl.style.display = 'block';

        solEl.textContent =
          '💡 خطوات الحل التفصيلية:\n\n' +
          current.steps;
      }

      /* =========================
         الأحداث
      ========================= */

      checkBtn.addEventListener(
        'click',
        checkAnswer
      );

      nextBtn.addEventListener(
        'click',
        generate
      );

      ansEl.addEventListener(
        'keydown',
        e => {

          if (e.key === 'Enter') {
            checkAnswer();
          }

        }
      );

      /* =========================
         تشغيل أول سؤال
      ========================= */

      generate();

    })();
  </script>

</body>
</html>
