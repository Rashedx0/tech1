<style>
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* ==========================================
       🔔 تنسيقات النافذة المنبثقة (Modal)
       ========================================== */

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        opacity: 0;
        visibility: hidden;
        transition: 0.4s ease-in-out;
    }

    .modal-overlay.show {
        opacity: 1;
        visibility: visible;
    }

    .modal-content {
        background: var(--glass-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--primary);
        padding: 40px 30px;
        border-radius: 30px;
        text-align: center;
        width: 85%;
        max-width: 400px;
        transform: scale(0.8) translateY(20px);
        transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2);
    }

    .modal-overlay.show .modal-content {
        transform: scale(1) translateY(0);
    }

    .modal-icon {
        font-size: 3.5rem;
        color: var(--accent);
        margin-bottom: 15px;
        animation: pulse-bell 2s infinite;
    }

    @keyframes pulse-bell {
        0% {
            transform: scale(1) rotate(0deg);
            text-shadow: 0 0 0 rgba(250, 204, 21, 0.7);
        }

        10% {
            transform: scale(1.1) rotate(15deg);
        }

        20% {
            transform: scale(1.1) rotate(-15deg);
        }

        30% {
            transform: scale(1.1) rotate(10deg);
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
        }

        40% {
            transform: scale(1) rotate(0deg);
        }

        100% {
            transform: scale(1) rotate(0deg);
            text-shadow: 0 0 0 rgba(250, 204, 21, 0);
        }
    }

    .modal-content h2 {
        color: white;
        font-size: 1.8rem;
        margin-top: 0;
        margin-bottom: 15px;
    }

    .modal-content p {
        color: #cbd5e1;
        font-size: 1.05rem;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .modal-btn {
        background: linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

        color: var(--bg-dark);
        border: none;
        padding: 15px 30px;
        font-family: 'Tajawal', sans-serif;
        font-size: 1.1rem;
        font-weight: 900;
        border-radius: 50px;
        cursor: pointer;
        transition: 0.3s;
        width: 100%;
        box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
    }

    .modal-btn:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.5);
    }

    /* ==========================================
       📢 الشريط العلوي
       ========================================== */

    .top-banner {
        position: fixed;
        top: 0;
        right: 0;
        width: 100%;
        background: linear-gradient(
            90deg,
            #38bdf8,
            #818cf8
        );

        color: #020617;
        padding: 12px 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 20px;

        font-weight: 700;

        z-index: 9999;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);

        animation: slideDown 0.6s ease;
        box-sizing: border-box;
    }

    .top-banner button {
        position: absolute;
        left: 20px;

        background: transparent;
        border: none;

        font-size: 18px;
        cursor: pointer;

        color: #020617;

        transition: 0.3s;
    }

    .top-banner button:hover {
        transform: scale(1.2);
    }

    @keyframes slideDown {
        from {
            transform: translateY(-100%);
        }

        to {
            transform: translateY(0);
        }
    }

    /* ==========================================
       📱 الجوال
       ========================================== */

    @media (max-width: 480px) {

        .main-card {
            padding: 30px 20px;
        }

        .featured-projects-btn {
            top: 15px;
            right: 15px;
            font-size: 0.8rem;
        }

        .modal-content {
            padding: 30px 20px;
        }

        .modal-content h2 {
            font-size: 1.5rem;
        }

        .modal-content p {
            font-size: 0.95rem;
        }

        .top-banner {
            padding: 10px 45px 10px 20px;
            font-size: 0.9rem;
            text-align: center;
        }

        .top-banner button {
            left: 15px;
        }
    }
</style>
</head>

<body>

<!-- ==========================================
     📢 الشريط العلوي
     ========================================== -->

<div id="topBanner" class="top-banner">

    <span>
        📢 تنبيه مهم: تابع آخر الإعلانات والتحديثات
    </span>

    <button
        type="button"
        onclick="closeBanner()"
        aria-label="إغلاق الإعلان">
        ✖
    </button>

</div>


<!-- ==========================================
     🚀 المشاريع المميزة
     ========================================== -->

<a href="projects.html" class="featured-projects-btn">
    <i class="fas fa-rocket"></i>
    المشاريع المميزة
</a>


<!-- ==========================================
     🔔 النافذة المنبثقة للإعلانات
     ========================================== -->

<div id="announcementModal" class="modal-overlay">

    <div class="modal-content">

        <div class="modal-icon">
            <i class="fas fa-bell"></i>
        </div>

        <h2>
            إعلان هام
        </h2>

        <p>
            الاختبار القادم يوم الأحد - 1447/12/21
            <br>
            يوجد ملخص للفائدة في قسم الفصل الدراسي الثاني.
            <br>
            بالتوفيق للجميع 🌟
        </p>

        <button
            type="button"
            onclick="closeModal()"
            class="modal-btn">

            حسناً، لقد فهمت

        </button>

    </div>

</div>


<!-- ==========================================
     ⏳ شاشة التحميل
     ========================================== -->

<div id="splash">

    <div class="loader"></div>

    <h2 style="color: var(--primary)">
        التقنية الرقمية 1
    </h2>

</div>


<!-- ==========================================
     🎓 البطاقة الرئيسية
     ========================================== -->

<div class="main-card">

    <div style="font-size: 3rem; margin-bottom: 15px;">
        🎓
    </div>

    <h1>
        مرحباً بكم
    </h1>

    <!-- باقي محتوى البطاقة الأصلية يوضع هنا -->

</div>


<!-- ==========================================
     JavaScript
     ========================================== -->

<script>

    /* ==========================================
       إخفاء شاشة التحميل وإظهار الإعلان
       ========================================== */

    window.addEventListener("load", function () {

        setTimeout(function () {

            const splash =
                document.getElementById("splash");

            const announcementModal =
                document.getElementById("announcementModal");

            if (splash) {
                splash.classList.add("hide");
            }

            /* إظهار الإعلان بعد اختفاء شاشة التحميل */
            setTimeout(function () {

                if (announcementModal) {
                    announcementModal.classList.add("show");
                }

            }, 500);

        }, 1000);

    });


    /* ==========================================
       إغلاق النافذة المنبثقة
       ========================================== */

    function closeModal() {

        const modal =
            document.getElementById("announcementModal");

        if (modal) {
            modal.classList.remove("show");
        }

    }


    /* ==========================================
       إغلاق الشريط العلوي
       ========================================== */

    function closeBanner() {

        const banner =
            document.getElementById("topBanner");

        if (banner) {
            banner.style.display = "none";
        }

    }


    /* ==========================================
       النسخ الذكي للبريد الإلكتروني
       ========================================== */

    function copyEmail() {

        const emailElement =
            document.getElementById("emailText");

        if (!emailElement) {
            console.error(
                "العنصر emailText غير موجود"
            );

            return;
        }

        const email =
            emailElement.innerText;

        navigator.clipboard.writeText(email)
            .then(function () {

                console.log(
                    "تم نسخ البريد الإلكتروني"
                );

            })
            .catch(function (error) {

                console.error(
                    "تعذر نسخ البريد الإلكتروني:",
                    error
                );

            });

    }

</script>
