<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقنية رقمية 1 | الترحيب</title>

<style>

/* 🚀 زر المشاريع المميزة */
.featured-projects-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  background: linear-gradient(135deg, #facc15, #f59e0b);
  color: #0f172a;
  padding: 12px 20px;
  border-radius: 18px;
  font-weight: 900;
  font-size: 1rem;
  text-decoration: none;
  box-shadow: 0 0 20px rgba(250,204,21,0.7);
  z-index: 10000;
  animation: floatGlow 2.5s ease-in-out infinite;
  transition: 0.3s ease;
}
.featured-projects-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(250,204,21,1);
}
@keyframes floatGlow {
  0%,100% {
    transform: translateY(0);
    box-shadow: 0 0 15px rgba(250,204,21,0.6);
  }
  50% {
    transform: translateY(-8px);
    box-shadow: 0 0 30px rgba(250,204,21,1);
  }
}

/* 📱 للجوال */
@media (max-width: 600px) {
  .featured-projects-btn {
    font-size: 0.9rem;
    padding: 10px 14px;
    top: 15px;
    right: 10px;
  }
}

/* © الحقوق */
.footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 0.85rem;
  color: #94a3b8;
  opacity: 0.8;
}
.footer span {
  color: #38bdf8;
  font-weight: bold;
}

/* ================= Splash Screen ================= */
#splash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #1e293b, #020617);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#splash.hide {
  opacity: 0;
  visibility: hidden;
}
.splash-content {
  text-align: center;
  animation: fadeUp 1.2s ease;
}
.splash-content .logo {
  font-size: 3rem;
  margin-bottom: 10px;
  animation: spin 1.8s linear infinite;
}
.splash-content h2 {
  color: #38bdf8;
  margin: 10px 0 5px;
  text-shadow: 0 0 10px rgba(56,189,248,0.6);
}
.splash-content p {
  color: #cbd5e1;
  font-size: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= الصفحة الرئيسية ================= */
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color: #f1f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* 🌟 صندوق الترحيب */
.welcome-box {
  background: #0f172a;
  padding: 40px 30px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 0 30px rgba(56,189,248,0.35);
  animation: float 3s ease-in-out infinite;
  max-width: 420px;
  width: 90%;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.welcome-box h1 {
  color: #38bdf8;
  font-size: 2rem;
  margin-bottom: 10px;
  text-shadow: 0 0 12px rgba(56,189,248,0.6);
}
.welcome-box p {
  color: #cbd5e1;
  font-size: 1.1rem;
  margin-bottom: 25px;
}

/* 🔘 الأزرار */
.semester-btn {
  display: block;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  color: #0f172a;
  text-decoration: none;
  font-size: 1.3rem;
  font-weight: 900;
  padding: 16px;
  border-radius: 18px;
  margin: 15px 0;
  transition: 0.3s;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}
.semester-btn:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #0ea5e9, #38bdf8);
  color: #fff;
}
.semester-btn.first {
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.8; }
}

/* ✉️ صندوق التواصل */
.contact-box {
  margin-top: 25px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(56,189,248,0.08);
  border: 1px solid rgba(56,189,248,0.25);
}
.contact-box h3 {
  margin: 0 0 10px;
  color: #38bdf8;
  font-size: 1.1rem;
}
.email-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.email-row a {
  color: #fde68a;
  font-weight: bold;
  text-decoration: underline;
}
.copy-btn {
  background: #38bdf8;
  color: #0f172a;
  border: none;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}
.copy-btn:hover {
  background: #0ea5e9;
  color: #fff;
}

/* 📱 للجوال */
@media (max-width: 600px) {
  .welcome-box h1 { font-size: 1.6rem; }
  .semester-btn { font-size: 1.15rem; }
}
</style>
</head>

<body>

<!-- 🚀 زر المشاريع المميزة -->
<a href="projects.html" class="featured-projects-btn">🚀 المشاريع المميزة</a>

<!-- 🌟 Splash Screen -->
<div id="splash">
  <div class="splash-content">
    <div class="logo">💻</div>
    <h2>تقنية رقمية 1</h2>
    <p>جارٍ التحميل...</p>
  </div>
</div>

<!-- 🌟 واجهة الترحيب -->
<div class="welcome-box">
  <h1>👨‍🏫 مرحبًا بكم</h1>
  <p>مادة تقنية رقمية 1<br>اختر الفصل الدراسي</p>

  <a href="S1/index_1.html" class="semester-btn first">📘 الفصل الدراسي الأول</a>
  <a href="S2/index_2.html" class="semester-btn">📕 الفصل الدراسي الثاني</a>

  <div class="contact-box">
    <h3>📩 للتواصل مع المعلم وإرسال الملفات</h3>
    <div class="email-row">
      <a href="mailto:t19839490@gmail.com">t19839490@gmail.com</a>
      <button class="copy-btn" onclick="copyEmail()">📋 نسخ</button>
    </div>
  </div>
</div>

<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("splash").classList.add("hide");
  }, 1200);
});
function copyEmail() {
  navigator.clipboard.writeText("t19839490@gmail.com").then(() => {
    alert("✅ تم نسخ الإيميل");
  });
}
</script>

<div class="footer">
  © جميع الحقوق محفوظة للمعلم <span>راشد العتيبي</span>
</div>

</body>
</html>
