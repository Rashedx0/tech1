<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020617">
    <meta name="description" content="بوابة التعلم الذكي لمادة تقنية رقمية 1 - الأستاذ راشد العتيبي">

    <title>تقنية رقمية 1 | بوابة التعلم الذكي</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==================================================
           المتغيرات الأساسية
        ================================================== */
        :root {
            --primary: #38bdf8;
            --primary-dark: #0ea5e9;
            --secondary: #818cf8;
            --accent: #facc15;

            --bg-dark: #020617;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);

            --border: rgba(255, 255, 255, 0.10);
            --border-primary: rgba(56, 189, 248, 0.35);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;

            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            --shadow-primary: 0 8px 25px rgba(56, 189, 248, 0.25);

            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==================================================
           إعادة الضبط وقواعد الصفحة
        ================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Tajawal", sans-serif;
            color: var(--text-primary);
            background: radial-gradient(circle at 50% -10%, #1e293b 0%, #0f172a 40%, var(--bg-dark) 80%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        a, button {
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        /* خلفية الإضاءة التجميلية */
        body::before, body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.15;
            z-index: -1;
        }

        body::before {
            top: -100px;
            right: -100px;
            background: var(--primary);
        }

        body::after {
            bottom: -100px;
            left: -100px;
            background: var(--secondary);
        }

        /* ==================================================
           شاشة التحميل (Splash Screen)
        ================================================== */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            margin-bottom: 16px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .splash-title {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 800;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================================================
           الهيدر وزر المشاريع المميزة
        ================================================== */
        .top-header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .featured-projects-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 8px 18px;
            color: #0f172a;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .featured-projects-btn:active {
            transform: scale(0.96);
        }

        /* ==================================================
           الحاوية الرئيسية
        ================================================== */
        .page-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-card {
            width: 100%;
            padding: 32px 20px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
            animation: cardAppear 0.6s ease both;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* أيقونة المعلم والعناوين */
        .teacher-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-size: 2.3rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .main-title {
            margin-bottom: 6px;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(to left, #ffffff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-description {
            margin-bottom: 24px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* ==================================================
           الاختبار التشخيصي (في المنتصف)
        ================================================== */
        .diagnostic-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(129, 140, 248, 0.15));
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            backdrop-filter: blur(10px);
            transition: transform var(--transition), background var(--transition), border-color var(--transition);
        }

        .diagnostic-card:active {
            transform: scale(0.98);
        }

        /* حالة إغلاق الاختبار التشخيصي */
        .diagnostic-card.disabled {
            cursor: not-allowed;
            opacity: 0.6;
            filter: grayscale(0.3);
            pointer-events: none;
        }

        .diagnostic-card.disabled .diagnostic-arrow {
            color: #94a3b8;
            background: rgba(148, 163, 184, 0.10);
        }

        .diagnostic-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            font-size: 1.25rem;
        }

        .diagnostic-text {
            flex: 1;
            text-align: right;
            display: flex;
            flex-direction: column;
        }

        .diagnostic-text strong {
            font-size: 0.95rem;
            font-weight: 800;
            color: #fff;
        }

        .diagnostic-text small {
            margin-top: 2px;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .diagnostic-arrow {
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--primary);
            background: rgba(56, 189, 248, 0.12);
        }

        /* ==================================================
           بنر اليوم الوطني السعودي (متجاوب للموبيل)
        ================================================== */
        .national-day-banner {
            width: 100%;
            margin-bottom: 20px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);
            transition: transform var(--transition), box-shadow var(--transition);
            background: #021a12;
            display: block;
        }

        .national-day-banner:active {
            transform: scale(0.98);
        }

        .national-day-banner img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* ==================================================
           أزرار التنقل (الفصول)
        ================================================== */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform var(--transition), background var(--transition), border-color var(--transition);
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        .nav-btn.active {
            color: var(--bg-dark);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            box-shadow: var(--shadow-primary);
        }

        .nav-btn i {
            font-size: 0.85rem;
        }

        /* ==================================================
           قسم التواصل
        ================================================== */
        .contact-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .contact-title {
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .email-pill {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 14px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .email-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }

        .copy-btn {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            display: grid;
            place-items: center;
            color: var(--primary);
            background: transparent;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background var(--transition), color var(--transition);
        }

        .copy-btn:active {
            background: rgba(56, 189, 248, 0.2);
        }

        .copy-btn.copied {
            color: #4ade80;
        }

        /* ==================================================
           الفوتير
        ================================================== */
        .footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .footer strong {
            color: var(--primary);
            font-weight: 700;
        }

        /* ==================================================
           تنسيقات الشاشات فائقة الصغر (أقل من 360px)
        ================================================== */
        @media (max-width: 360px) {
            .main-card {
                padding: 24px 14px;
            }
            .main-title {
                font-size: 1.5rem;
            }
            .diagnostic-text small {
                display: none;
            }
            .email-pill {
                font-size: 0.75rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ==================================================
         شاشة التحميل
    ================================================== -->
    <div id="splash" aria-label="جاري تحميل الموقع">
        <div class="loader"></div>
        <h2 class="splash-title">التقنية الرقمية 1</h2>
    </div>

    <!-- ==================================================
         الهيدر العلوي
    ================================================== -->
    <header class="top-header">
        <a href="projects.html" class="featured-projects-btn" aria-label="الانتقال إلى المشاريع المميزة">
            <i class="fas fa-rocket" aria-hidden="true"></i>
            <span>المشاريع المميزة</span>
        </a>
    </header>

    <!-- ==================================================
         المحتوى الرئيسي
    ================================================== -->
    <main class="page-wrapper">
        <section class="main-card">

            <!-- أيقونة المعلم -->
            <div class="teacher-icon" aria-hidden="true">👨‍🏫</div>

            <!-- العنوان -->
            <h1 class="main-title">مرحباً بكم</h1>
            <p class="main-description">
                مادة تقنية رقمية 1 <br>
                بوابتك الرقمية للإبداع والتميز
            </p>

            <!-- ==================================================
                 الاختبار التشخيصي (في المنتصف)
            ================================================== -->
            <a href="#" class="diagnostic-card disabled"
               aria-label="الاختبار التشخيصي مغلق"
               aria-disabled="true"
               onclick="return false;">
                <span class="diagnostic-icon" aria-hidden="true">🧪</span>
                <span class="diagnostic-text">
                    <strong>الاختبار التشخيصي</strong>
                    <small>الاختبار مغلق حاليًا</small>
                </span>
                <span class="diagnostic-arrow" aria-hidden="true">
                    <i class="fas fa-lock"></i>
                </span>
            </a>

            <!-- ==================================================
                 بنر اليوم الوطني السعودي
            ================================================== -->
            <div class="national-day-banner">
                <img src="أخضر حديث اليوم الوطني السعودي بانر.png" alt="بانر اليوم الوطني السعودي - عزنا بطبعنا - كل عام والوطن بخير">
            </div>

            <!-- ==================================================
                 أزرار الفصول الدراسية
            ================================================== -->
            <nav class="btn-container" aria-label="الفصول الدراسية">
                <!-- الفصل الدراسي الأول -->
                <a href="S1/index_1.html" class="nav-btn active">
                    <span>الفصل الدراسي الأول</span>
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </a>

                <!-- الفصل الدراسي الثاني -->
                <a href="S2/index_2.html" class="nav-btn">
                    <span>الفصل الدراسي الثاني</span>
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </a>
            </nav>

            <!-- ==================================================
                 قسم التواصل
            ================================================== -->
            <section class="contact-section">
                <p class="contact-title">📩 للتواصل مع المعلم وإرسال الملفات</p>
                <div class="email-pill">
                    <span id="emailText" class="email-text">t19839490@gmail.com</span>
                    <button type="button" id="copyButton" class="copy-btn" title="نسخ الإيميل" aria-label="نسخ البريد الإلكتروني">
                        <i class="fas fa-copy" aria-hidden="true"></i>
                    </button>
                </div>
            </section>

        </section>
    </main>

    <!-- ==================================================
         التذييل (الفوتير)
    ================================================== -->
    <footer class="footer">
        جميع الحقوق محفوظة © <br>
        <strong>الأستاذ / راشـد العتيبي</strong>
    </footer>

    <!-- ==================================================
         JavaScript
    ================================================== -->
    <script>
        "use strict";

        // إخفاء شاشة التحميل عند اكتمال التحميل
        window.addEventListener("load", () => {
            const splash = document.getElementById("splash");
            setTimeout(() => {
                splash.classList.add("hide");
            }, 500);
        });

        // نسخ البريد الإلكتروني
        const copyButton = document.getElementById("copyButton");
        const emailText = document.getElementById("emailText");

        async function copyEmail() {
            const email = emailText.textContent.trim();

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(email);
                } else {
                    fallbackCopy(email);
                }
                showCopiedState();
            } catch (error) {
                console.error("حدث خطأ أثناء نسخ البريد الإلكتروني:", error);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
        }

        function showCopiedState() {
            const icon = copyButton.querySelector("i");
            copyButton.classList.add("copied");
            icon.className = "fas fa-check";
            copyButton.setAttribute("title", "تم النسخ");

            setTimeout(() => {
                copyButton.classList.remove("copied");
                icon.className = "fas fa-copy";
                copyButton.setAttribute("title", "نسخ الإيميل");
            }, 2000);
        }

        copyButton.addEventListener("click", copyEmail);
    </script>

</body>

</html>
