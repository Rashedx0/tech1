<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقنية رقمية 1 | الترحيب</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color: #f1f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* 🌟 صندوق الترحيب */
.welcome-box {
  background: #0f172a;
  padding: 40px 30px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 0 30px rgba(56,189,248,0.35);
  animation: float 3s ease-in-out infinite;
  max-width: 420px;
  width: 90%;
}

/* ✨ حركة خفيفة */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.welcome-box h1 {
  color: #38bdf8;
  font-size: 2rem;
  margin-bottom: 10px;
  text-shadow: 0 0 12px rgba(56,189,248,0.6);
}

.welcome-box p {
  color: #cbd5e1;
  font-size: 1.1rem;
  margin-bottom: 35px;
}

/* 🔘 الأزرار */
.semester-btn {
  display: block;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  color: #0f172a;
  text-decoration: none;
  font-size: 1.3rem;
  font-weight: 900;
  padding: 16px;
  border-radius: 18px;
  margin: 15px 0;
  transition: 0.3s;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.semester-btn:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #0ea5e9, #38bdf8);
  color: #fff;
}

/* ✨ وميض بسيط */
.semester-btn.first {
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.8; }
}

/* 📱 للجوال */
@media (max-width: 600px) {
  .welcome-box h1 {
    font-size: 1.6rem;
  }
  .semester-btn {
    font-size: 1.15rem;
  }
}
</style>
</head>

<body>

<div class="welcome-box">
  <h1>👨‍🏫 مرحبًا بكم</h1>
  <p>مادة تقنية رقمية 1<br>اختر الفصل الدراسي</p>

  <!-- 🔗 اربط زر الفصل الأول بصفحتك الحالية -->
  <a href="index_1.html" class="semester-btn first">
    📘 الفصل الدراسي الأول
  </a>

  <!-- 🔗 رابط الفصل الثاني (عدله لاحقًا) -->
  <a href="index_2.html" class="semester-btn">
    📕 الفصل الدراسي الثاني
  </a>
</div>

</body>
</html>
