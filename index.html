<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع مغلق | تقنية رقمية 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #facc15;
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 0% 0%, #1e293b 0%, #020617 100%);
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 🌟 Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: 0.8s ease-in-out;
        }
        #splash.hide { opacity: 0; visibility: hidden; }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* 📦 حاوية البطاقة الرئيسية */
        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 35px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .main-card h1 {
            font-size: 2.4rem;
            margin-bottom: 5px;
            background: linear-gradient(to left, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-card p {
            color: #e2e8f0;
            margin-bottom: 35px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* 📧 منطقة التواصل */
        .contact-section {
            margin-top: 20px;
            padding-top: 25px;
            border-top: 1px solid var(--glass-border);
        }

        .email-pill {
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: monospace;
            font-size: 1rem;
        }

        .copy-icon {
            cursor: pointer;
            color: var(--primary);
            transition: 0.2s;
        }
        .copy-icon:hover { transform: scale(1.2); color: white; }

        /* © التذييل */
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
        .footer b { color: var(--primary); }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .main-card { padding: 40px 20px; }
            .main-card h1 { font-size: 2rem; }
            .main-card p { font-size: 1.1rem; }
        }
    </style>
</head>

<body>

    <!-- شاشة التحميل -->
    <div id="splash">
        <div class="loader"></div>
        <h2 style="color: var(--primary)">التقنية الرقمية 1</h2>
    </div>

    <div class="footer">
        جميع الحقوق محفوظة © <b> المعلم راشد العتيبي</b>
    </div>

    <script>
        // إخفاء شاشة التحميل
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("splash").classList.add("hide");
            }, 1000);
        });

        // وظيفة النسخ الذكية للإيميل
        function copyEmail() {
            const email = document.getElementById("emailText").innerText;
            navigator.clipboard.writeText(email).then(() => {
                const icon = document.querySelector('.copy-icon');
                icon.className = "fas fa-check";
                icon.style.color = "#4ade80";
                setTimeout(() => {
                    icon.className = "fas fa-copy copy-icon";
                    icon.style.color = "var(--primary)";
                }, 2000);
            });
        }
    </script>
</body>
</html>
