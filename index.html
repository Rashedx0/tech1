<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقنية الرقمية 1</title>
    <!-- مكتبة الأيقونات (تأكد من وجودها لعرض الأيقونات بشكل صحيح) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ==========================================
           🔔 تنسيقات النافذة المنبثقة (Modal) الجديدة
           ========================================== */
        :root {
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #facc15;
            --bg-dark: #020617;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            color: white;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000; /* ليكون فوق كل شيء */
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease-in-out;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--primary);
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            transform: scale(0.8) translateY(20px);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 15px;
            animation: pulse-bell 2s infinite;
        }

        @keyframes pulse-bell {
            0% { transform: scale(1) rotate(0deg); text-shadow: 0 0 0 rgba(250, 204, 21, 0.7); }
            10% { transform: scale(1.1) rotate(15deg); }
            20% { transform: scale(1.1) rotate(-15deg); }
            30% { transform: scale(1.1) rotate(10deg); text-shadow: 0 0 20px rgba(250, 204, 21, 0.6); }
            40% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1) rotate(0deg); text-shadow: 0 0 0 rgba(250, 204, 21, 0); }
        }

        .modal-content h2 {
            color: white;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .modal-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            border: none;
            padding: 15px 30px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
        }

        .modal-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.5);
        }

        .top-banner {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #020617;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-weight: 700;
            z-index: 9999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: slideDown 0.6s ease;
            box-sizing: border-box;
        }

        .top-banner button {
            position: absolute;
            left: 20px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #020617;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .featured-projects-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background-color: var(--primary);
            color: var(--bg-dark);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            transition: opacity 0.5s;
        }

        #splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .main-card {
            padding: 50px;
            text-align: center;
            margin-top: 60px; /* لإعطاء مساحة للشريط العلوي */
        }

        @media (max-width: 480px) {
            .main-card { padding: 30px 20px; }
            .featured-projects-btn { font-size: 0.8rem; }
            .modal-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div id="topBanner" class="top-banner">
        <span>📢 إعلان هام</span>
        <button onclick="closeBanner()">✖</button>
    </div>

    <!-- زر المشاريع المميزة -->
    <a href="projects.html" class="featured-projects-btn">
        <i class="fas fa-rocket"></i> المشاريع المميزة
    </a>

    <!-- النافذة المنبثقة للإعلانات -->
    <div id="announcementModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-bell"></i>
            </div>
            <h2>إعلان هام</h2>
            <p>الاختبار القادم يوم الأحد - 1447/12/21 (يوجد ملخص للفائدة في قسم الفصل الدراسي الثاني) بالتوفيق</p>
            <button onclick="closeModal()" class="modal-btn">حسناً، لقد فهمت</button>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="splash">
        <div class="loader"></div>
        <h2 style="color: var(--primary)">التقنية الرقمية 1</h2>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="main-card">
        <div style="font-size: 3rem; margin-bottom: 15px;">🎓</div>
        <h1>مرحباً بكم</h1>
        <!-- نص مخفي لاستخدامه في النسخ -->
        <p id="emailText" style="display:none;">example@email.com</p>
    </div>

    <script>
        // إغلاق الشريط العلوي
        function closeBanner() {
            const banner = document.getElementById("topBanner");
            if (banner) {
                banner.style.display = "none";
            }
        }

        // التحكم بشاشة التحميل والنافذة المنبثقة
        window.addEventListener("load", () => {
            setTimeout(() => {
                // إخفاء شاشة التحميل
                const splash = document.getElementById("splash");
                if (splash) splash.classList.add("hide");
                
                // إظهار نافذة الإعلان بعد إخفاء شاشة التحميل بنصف ثانية
                setTimeout(() => {
                    const modal = document.getElementById("announcementModal");
                    if (modal) modal.classList.add("show");
                }, 500);
            }, 1000);
        });

        // وظيفة إغلاق النافذة المنبثقة
        function closeModal() {
            const modal = document.getElementById("announcementModal");
            if (modal) modal.classList.remove("show");
        }

        // وظيفة النسخ الذكية (مكتملة)
        function copyEmail() {
            const emailElement = document.getElementById("emailText");
            if (emailElement) {
                const email = emailElement.innerText;
                navigator.clipboard.writeText(email).then(() => {
                    alert("تم نسخ البريد الإلكتروني بنجاح!");
                }).catch(err => {
                    console.error("حدث خطأ أثناء النسخ: ", err);
                });
            }
        }
    </script>
</body>
</html>
