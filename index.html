<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقنية رقمية 1 | بوابة التعلم الذكي</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #facc15;
            --bg-dark: #020617;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 🚀 زر المشاريع المميزة */
        .featured-projects-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.7);
            z-index: 1000;
            animation: floatGlow 2.5s ease-in-out infinite;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .featured-projects-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(250, 204, 21, 1);
        }

        @keyframes floatGlow {
            0%, 100% { transform: translateY(0); box-shadow: 0 0 15px rgba(250,204,21,0.6); }
            50% { transform: translateY(-8px); box-shadow: 0 0 30px rgba(250,204,21,1); }
        }

        /* 🌟 Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        /* 📦 البطاقة الرئيسية */
        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 35px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .main-card h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            background: linear-gradient(to left, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-card p {
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* 🔘 الأزرار */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-btn {
            position: relative;
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            border: none;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        /* 📧 منطقة التواصل */
        .contact-section {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid var(--glass-border);
        }

        .email-pill {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-family: monospace;
            font-size: 1rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .copy-icon {
            cursor: pointer;
            color: var(--primary);
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .copy-icon:hover {
            transform: scale(1.2);
            color: white;
        }

        /* © التذييل */
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            width: 100%;
        }

        .footer b {
            color: var(--primary);
        }

        /* 📱 شاشات الجوال */
        @media (max-width: 480px) {
            .main-card { padding: 30px 20px; }
            .featured-projects-btn { top: 15px; right: 15px; font-size: 0.85rem; padding: 10px 16px; }
            .main-card h1 { font-size: 1.8rem; }
        }
    </style>
</head>

<body>

    <!-- 🚀 زر المشاريع المميزة -->
    <a href="projects.html" class="featured-projects-btn">
        <i class="fas fa-rocket"></i> المشاريع المميزة
    </a>

    <!-- 🌟 Splash Screen -->
    <div id="splash">
        <div class="loader"></div>
        <h2 style="color: var(--primary)">التقنية الرقمية 1</h2>
    </div>

    <!-- 🌟 واجهة الترحيب الرئيسية -->
    <div class="main-card">
        <div style="font-size: 3rem; margin-bottom: 15px;">👨‍🏫</div>
        <h1>مرحباً بكم</h1>
        <p>مادة تقنية رقمية 1<br>بوابتك الرقمية للإبداع والتميز</p>

        <div class="btn-container">
            <a href="S1/index_1.html" class="nav-btn active">
                <span>الفصل الدراسي الأول</span>
                <i class="fas fa-chevron-left"></i>
            </a>
            <a href="S2/index_2.html" class="nav-btn">
                <span>الفصل الدراسي الثاني</span>
                <i class="fas fa-chevron-left"></i>
            </a>
        </div>

        <div class="contact-section">
            <p style="margin-bottom: 15px; font-size: 0.95rem;">📩 للتواصل مع المعلم وإرسال الملفات</p>
            <div class="email-pill">
                <span id="emailText">t19839490@gmail.com</span>
                <i class="fas fa-copy copy-icon" onclick="copyEmail()" title="نسخ الإيميل"></i>
            </div>
        </div>
    </div>

    <!-- حقوق النشر -->
    <div class="footer">
        جميع الحقوق محفوظة © <b>راشد العتيبي</b>
    </div>

    <script>
        // إخفاء الشاشة الترحيبية
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("splash").classList.add("hide");
            }, 1200);
        });

        // وظيفة النسخ الذكية مع تغيير الأيقونة
        function copyEmail() {
            const email = document.getElementById("emailText").innerText;
            navigator.clipboard.writeText(email).then(() => {
                const icon = document.querySelector('.copy-icon');
                
                // تغيير الأيقونة إلى علامة صح
                icon.className = "fas fa-check copy-icon";
                icon.style.color = "#4ade80"; // لون أخضر
                
                // إعادة الأيقونة بعد ثانيتين
                setTimeout(() => {
                    icon.className = "fas fa-copy copy-icon";
                    icon.style.color = "var(--primary)";
                }, 2000);
            }).catch(err => {
                console.error("حدث خطأ أثناء النسخ: ", err);
            });
        }
    </script>
</body>
</html>
