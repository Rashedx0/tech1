<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقنية رقمية 1 | الموقع مغلق</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #020617);
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #f1f5f9;
    }

    /* 🔒 صندوق الإغلاق */
    .closed-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 50px 35px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 0 35px rgba(56,189,248,0.25);
      max-width: 420px;
      width: 90%;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lock {
      font-size: 3.2rem;
      margin-bottom: 15px;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    h1 {
      color: #f87171;
      font-size: 1.9rem;
      margin-bottom: 12px;
      font-weight: 900;
    }

    p {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.9;
    }

    .note {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    /* © الحقوق */
    footer {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      opacity: 0.8;
    }

    footer span {
      color: #38bdf8;
      font-weight: bold;
    }
	/* 🔙 زر العودة للرئيسية */
.back-btn {
  display: inline-block;
  margin-top: 22px;
  padding: 10px 20px;
  border-radius: 14px;
  background: #334155;
  color: #f1f5f9;
  text-decoration: none;
  font-weight: bold;
  transition: 0.25s;
}

.back-btn:hover {
  background: #475569;
  transform: scale(1.05);
}
  </style>
</head>

<body>

  <div class="closed-box">
    <div class="lock">🔒</div>
    <h1>الموقع مغلق حاليًا</h1>
    <p>
      يتم حاليًا العمل على إعداد محتوى<br>
      الفصل الدراسي الثاني
    </p>
    <div class="note">
      سيتم فتح الموقع فور اكتمال التجهيز
    </div>
	<a href="index.html" class="back-btn">🔙 العودة للصفحة الرئيسية</a>
  </div>

  <footer>
    © جميع الحقوق محفوظة للمعلم <span>راشد العتيبي</span> – 2025
  </footer>

</body>
</html>
