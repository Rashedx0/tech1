<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل Cisco Packet Tracer - المعلم راشد العتيبي</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background-color: #121a2d;
      margin: 0;
      padding: 0;
      line-height: 1.8;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      color: #38bdf8;
      text-align: center;
      padding: 40px 20px;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    .info-card {
      background: #334155;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 40px;
      border: 1px solid #475569;
    }

    .info-card h2 {
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .download-section {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .download-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #38bdf8;
      color: #0f172a;
      padding: 25px 40px;
      font-size: 1.2rem;
      border-radius: 15px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;
      min-width: 200px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
    }

    .download-btn:hover {
      background: #0ea5e9;
      color: #fff;
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
    }

    .download-btn span {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 5px;
      font-weight: normal;
    }

    .download-btn i {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      color: #94a3b8;
      text-decoration: none;
      transition: 0.2s;
    }

    .back-link:hover {
      color: #38bdf8;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: auto;
    }

    /* أنيميشن الظهور */
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .download-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<header>
    🌐 محاكي الشبكات <br>
    Cisco Packet Tracer
</header>

<div class="container fade-in">
  <div class="info-card">
    <h2>جاهز للتطبيق العملي؟ 🚀</h2>
    <p>قم بتحميل النسخة المتوافقة مع جهازك للبدء في تصميم وبناء شبكات الحاسب الخاصة بك.</p>
  </div>

  <div class="download-section">
    <!-- رابط الويندوز المباشر -->
    <a href="https://archive.org/download/packet-tracer-821-windows/PacketTracer_821_Windows_64bit.exe" class="download-btn">
      <div><img src=https://www.citypng.com/public/uploads/preview/hd-windows-11-logo-icon-transparent-background-701751694967888zqtluh5aaw.png /></div>
      نسخة الويندوز
      <span>Windows 10/11 (64-bit)</span>
    </a>

    <!-- رابط الماك المباشر -->
    <a href="https://archive.org/download/packet-tracer-821-macos/PacketTracer_821_MacOS.dmg" class="download-btn" style="background-color: #f8fafc; color: #0f172a;">
      <div style="font-size: 2.5rem;">🍎</div>
      نسخة الماك
      <span>macOS 11.0 or newer</span>
    </a>
  </div>

  <a href="index_2.html" class="back-link">← العودة للصفحة الرئيسية</a>
</div>

<footer>
  📚 مادة تقنية رقمية 1 - المعلم راشد العتيبي © 2025
</footer>

</body>
</html>
